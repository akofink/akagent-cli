name: Coverage

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run tests with merged coverage
        run: |
          packages=$(go list ./... | grep -v '/cmd/akagent$')
          go test -count=1 -coverpkg=./... -coverprofile=coverage.out $packages
      - name: Report coverage and enforce durability ratchet
        run: |
          python3 - <<'PY'
          import os
          import sys
          from collections import defaultdict
          from pathlib import Path

          blocks = {}
          with Path("coverage.out").open() as profile:
              next(profile)
              for line in profile:
                  location, count, hits = line.rstrip().rsplit(" ", 2)
                  filename = location.split(":", 1)[0]
                  if filename.endswith("/cmd/akagent/main.go"):
                      continue
                  blocks[location] = (int(count), blocks.get(location, (0, False))[1] or int(hits) > 0)

          covered = defaultdict(int)
          statements = defaultdict(int)
          for location, (count, hit) in blocks.items():
              package = location.split(":", 1)[0].rsplit("/", 1)[0]
              statements[package] += count
              if hit:
                  covered[package] += count

          total_covered = sum(covered.values())
          total_statements = sum(statements.values())
          summary = ["## Merged Go coverage", "", "| Package | Coverage |", "| --- | ---: |"]
          for package in sorted(statements):
              percent = 100 * covered[package] / statements[package]
              summary.append(f"| `{package}` | {percent:.1f}% |")
          total_percent = 100 * total_covered / total_statements if total_statements else 0
          summary.append(f"| **Total** | **{total_percent:.1f}% ({total_covered}/{total_statements})** |")

          # Thresholds are tenths of a percent, measured after the durability tests.
          floors = {"Total": (total_covered, total_statements, 738)}
          store_package = next((name for name in statements if name.endswith("/internal/store")), None)
          if store_package is not None:
              floors["internal/store"] = (covered[store_package], statements[store_package], 722)
          failures = []
          for name in ("Total", "internal/store"):
              if name not in floors:
                  failures.append(f"{name}: coverage data missing")
                  continue
              hit, count, floor = floors[name]
              if not count or hit * 1000 < floor * count:
                  failures.append(f"{name}: {hit}/{count} is below {floor / 10:.1f}%")
          summary.extend(["", "Coverage floors: total 73.8%, internal/store 72.2%."])
          if failures:
              summary.extend(["", "Coverage ratchet failed: " + "; ".join(failures)])
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as output:
              output.write("\n".join(summary) + "\n")
          if failures:
              print("\n".join(failures), file=sys.stderr)
              sys.exit(1)
          PY
